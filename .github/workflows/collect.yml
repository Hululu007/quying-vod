name: catalog-collect

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger batch collect
        env:
          COLLECT_TOKEN: ${{ secrets.COLLECT_TOKEN }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          BASE="${SITE_URL:-https://quying-vod.vercel.app}"
          if [ -z "$COLLECT_TOKEN" ]; then
            echo "COLLECT_TOKEN 未配置，跳过"
            exit 0
          fi
          curl -fsS --max-time 120 "$BASE/api/admin/collect?token=$COLLECT_TOKEN&pages=2"
